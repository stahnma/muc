# MUC Client Configuration (optional)
# If this file is absent, the client uses discovery (DNS/Consul) or MUC_NATS_URL env var.

# Explicit NATS server URL (overrides discovery)
# nats_url: nats://muc-server.local:4222

# NATS port (used with DNS discovery if nats_url is not set)
# nats_port: 4222

# Remote updates (off by default)
#
# When true, this host listens for "install your pending updates" commands from
# the dashboard and runs its update script as root. The opt-in lives here, on
# the host that would be patched: a client that has not set this never
# subscribes to the command subject, so no server setting can patch it.
#
# The server must also be configured with remote_updates: true for the button to
# appear. Note that NATS here is unauthenticated, so this trusts everything that
# can reach the NATS port - enable it on a network where that is acceptable.
# allow_remote_updates: true

# The command run to install updates. Defaults to the packaged
# /usr/libexec/muc/upd, falling back to /usr/local/bin/upd, /usr/bin/upd, then
# 'upd' on PATH. Set this to use a different script.
# update_command: /usr/local/bin/upd

# Let the dashboard reboot this host when it reports a pending reboot. Off by
# default, and separate from allow_remote_updates: patching this host and
# interrupting whatever it is doing are different decisions. The server must
# also set remote_reboot: true. The same caveat about unauthenticated NATS
# applies.
# allow_remote_reboot: true
