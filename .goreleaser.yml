version: 2

builds:
  - id: muc-server
    dir: server
    binary: muc-server
    env:
      - CGO_ENABLED=0
    goos:
      - linux
    goarch:
      - amd64
      - arm64
    ldflags:
      - -X main.Version={{.Version}}

  - id: muc-client
    dir: client
    binary: muc-client
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
    goarch:
      - amd64
      - arm64
    ignore:
      - goos: darwin
        goarch: amd64
    ldflags:
      - -X main.Version={{.Version}}

archives:
  - id: muc-server
    ids:
      - muc-server
    name_template: "muc-server_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
  - id: muc-client
    ids:
      - muc-client
    name_template: "muc-client_{{ .Version }}_{{ .Os }}_{{ .Arch }}"

nfpms:
  - id: muc-server
    ids:
      - muc-server
    package_name: muc-server
    maintainer: Michael Stahnke <stahnma@gmail.com>
    vendor: Michael Stahnke
    homepage: https://github.com/stahnma/muc
    description: "My Update Center - server component"
    license: MIT
    formats:
      - rpm
      - deb
    contents:
      - src: server/dist/muc-server.service
        dst: /usr/lib/systemd/system/muc-server.service
      - src: server/dist/config.yml
        dst: /etc/muc/config.yml
        type: config|noreplace
    scripts:
      preinstall: server/dist/preinstall.sh
      postinstall: server/dist/postinstall.sh
      preremove: server/dist/preremove.sh
      postremove: server/dist/postremove.sh

  - id: muc-client
    ids:
      - muc-client
    package_name: muc-client
    maintainer: Michael Stahnke <stahnma@gmail.com>
    vendor: Michael Stahnke
    homepage: https://github.com/stahnma/muc
    description: "My Update Center - client agent"
    license: MIT
    formats:
      - rpm
      - deb
    contents:
      - src: client/dist/muc-client.service
        dst: /usr/lib/systemd/system/muc-client.service
      - src: client/dist/muc-client-recheck.path
        dst: /usr/lib/systemd/system/muc-client-recheck.path
      - src: client/dist/muc-client-recheck.service
        dst: /usr/lib/systemd/system/muc-client-recheck.service
      - src: client/dist/client.yml
        dst: /etc/muc/client.yml
        type: config|noreplace
      # The update script the client runs when the dashboard asks it to patch
      # this host. It is inert unless allow_remote_updates is set, and is also
      # perfectly usable by hand: `/usr/libexec/muc/upd -n` for a dry run.
      - src: client/scripts/upd
        dst: /usr/libexec/muc/upd
        file_info:
          mode: 0755
    # needs-restarting is how the client answers "does this host need a reboot"
    # on rpm systems. Without it that check falls back to comparing the running
    # kernel against the newest installed one, which cannot see a glibc or
    # systemd update at all, so hosts under-report reboots rather than
    # over-report them — silently.
    #
    # A weak dependency, not a hard one: one rpm is built for every rpm distro,
    # and SUSE packages no needs-restarting at all (the client uses `zypper
    # needs-rebooting` there), so requiring it would make the package
    # uninstallable on a platform the client otherwise supports. dnf installs
    # weak dependencies by default, so EL and Fedora get it regardless.
    #
    # On the file rather than on dnf-utils, because the package that owns it
    # keeps moving: EL8 and EL9 have a real dnf-utils, EL10 ships the command in
    # yum-utils (which only Provides dnf-utils), and Fedora's dnf5 has moved it
    # again. The file path is the requirement itself and resolves to whichever
    # of them the host has.
    overrides:
      rpm:
        recommends:
          - /usr/bin/needs-restarting
    scripts:
      preinstall: client/dist/preinstall.sh
      postinstall: client/dist/postinstall.sh
      preremove: client/dist/preremove.sh
      postremove: client/dist/postremove.sh

checksum:
  name_template: "checksums.txt"

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^chore:"
