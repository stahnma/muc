version: 2
updates:
  - package-ecosystem: gomod
    directories:
      - /client
      - /server
    schedule:
      interval: weekly
      day: monday
    groups:
      # One PR for all minor/patch bumps; majors get their own PR.
      go-minor-patch:
        update-types: [minor, patch]
    commit-message:
      prefix: "chore(deps)"

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    groups:
      actions:
        patterns: ["*"]
    commit-message:
      prefix: "chore(ci)"
