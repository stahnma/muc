# MUC Server Configuration
# Environment variables (MUC_* prefix) override these values.

# NATS connection: "embedded" starts a built-in NATS server.
# Set to "nats://host:port" to use an external NATS server.
nats_url: embedded
nats_port: 4222

# BoltDB database path (relative to WorkingDirectory or absolute)
db_path: systems.db

# HTTP listen port for the web dashboard
http_port: 8080

# Consul service registration (leave default to disable if Consul isn't running)
# consul_url: http://localhost:8500
# consul_tags applies to the HTTP ("muc") service.
# consul_tags: muc,monitoring
# consul_nats_tags applies to the NATS ("muc-nats") service.
# Leave unset to reuse consul_tags for both services.
# consul_nats_tags: muc-nats,monitoring

# Remote updates (off by default)
#
# When true, the dashboard offers an "install pending updates" button for hosts
# that have themselves opted in (allow_remote_updates in their client config),
# and the POST /api/systems/{hostname}/update route starts working. With this
# false the route returns 403 and no button is drawn.
#
# There is no authentication in front of the dashboard or NATS, so this is a
# home-network convenience, not an authorization boundary.
# remote_updates: true

# Remote reboots (off by default)
#
# When true, the dashboard offers a reboot control for hosts that report a
# pending reboot and have themselves opted in (allow_remote_reboot in their
# client config), and POST /api/systems/{hostname}/reboot starts working.
# Separate from remote_updates on purpose; the same caveat applies.
# remote_reboot: true
